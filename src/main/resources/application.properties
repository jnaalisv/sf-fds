spring.application.name=sf-fds

# API keys: one entry per calling service, SHA-256 (hex) of the key only.
# The entry below is a well-known LOCAL DEVELOPMENT key: X-API-Key: local-dev-api-key-do-not-use-in-production
# Override the whole list outside local development, e.g. with env vars
# FDS_APIKEYS_0_CLIENT / FDS_APIKEYS_0_SHA256 (setting the list anywhere replaces it entirely).
fds.api-keys[0].client=local-dev
fds.api-keys[0].sha256=d5f0236bb84a5cf975aa95f2a41c9938f0e7cacf8e00591dead5d3ea1d053e0d

# Terminals known at startup. These are LOCAL DEVELOPMENT terminals; requests for any
# other terminal id are denied as "unknown terminal". Like fds.api-keys, setting the list
# anywhere else (e.g. FDS_TERMINALS_0_ID / FDS_TERMINALS_0_COUNTRY) replaces it entirely.
fds.terminals[0].id=TERM-ES-001
fds.terminals[0].country=ES
fds.terminals[1].id=TERM-FI-001
fds.terminals[1].country=FI
fds.terminals[2].id=TERM-SE-001
fds.terminals[2].country=SE
